services:
  db:
    image: postgres:16-alpine
    container_name: kpi_app_db
    restart: always
    environment:
      POSTGRES_DB: kpi_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - kpi_app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: kpi_app_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@db:5432/kpi_app
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: HS256
      ACCESS_TOKEN_EXPIRE_MIN: 60
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
    ports:
      - "127.0.0.1:8020:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: kpi_app_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8021:80"

volumes:
  kpi_app_db_data:
